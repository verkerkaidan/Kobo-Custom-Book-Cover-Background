[screensaver]
# --- sources ---------------------------------------------------------------
db_path    = /mnt/onboard/.kobo/KoboReader.sqlite
# Use the current book's own cover art as the background, automatically.
# Nickel caches covers under .kobo-images; the full-size one is very nearly
# screen-height already. Set false to always use the fixed image below.
cover_background = true
kobo_images      = /mnt/onboard/.kobo-images

# --- decorative frame ------------------------------------------------------
# A full-screen PNG drawn OVER the cover, with a see-through hole in it. Draw
# at 1072x1448, erase the middle to transparent, and the cover appears in the
# hole with your artwork around it. Leave blank for no frame.
#
# Staged as .dat for the same reason as the background: a stray .png in here
# gets indexed by Nickel as a phantom book.
frame = /mnt/onboard/.adds/kobo-screensaver/assets/frame.dat

# Where the cover goes. "auto" finds the transparent hole in the frame by
# itself — no measuring. Override with x,y,w,h if you want it somewhere else.
cover_window = auto

# cover  = fill the hole completely, cropping the cover's edges (no gaps)
# contain = show the whole cover, with mat_colour around it inside the hole
cover_fit = cover

# Shows behind the cover and anywhere your artwork is see-through.
mat_colour = 18,18,22

# Fallback, used whenever cover_background is false, no book is open, or the
# cover isn't cached yet.
# .dat, not .png: Nickel indexes stray images into your library as phantom
# books. The extension is ignored — the file's actual contents are sniffed, so
# any PNG or JPEG works under this name.
background = /mnt/onboard/.adds/kobo-screensaver/assets/background.dat
output     = /mnt/onboard/.kobo/screensaver/dynamic.png

# --- geometry (0,0 = auto-detect from /sys/class/graphics/fb0/virtual_size) -
# Clara Colour 1072x1448 · Libra Colour 1264x1680 · Elipsa 2E 1404x1872
width  = 0
height = 0

# --- typography ------------------------------------------------------------
# Any TTF or OTF. Swap in your own by replacing these two files.
# Bundled with the package, so this works on any firmware. Kobo's own fonts
# are NOT reliably at /usr/local/Kobo/fonts/ — on this device they weren't
# there at all, which is what "no usable font found" in the log means.
font       = /mnt/onboard/.adds/kobo-screensaver/assets/font.ttf
font_bold  = /mnt/onboard/.adds/kobo-screensaver/assets/font-bold.ttf
title_size = 44
body_size  = 34
small_size = 26

# --- layout ----------------------------------------------------------------
margin      = 70

# Nudges the whole text block down (negative moves it up). Set to clear the
# example frame's inner rules, which sit at y=1140 and y=1150 — without it the
# title runs straight through them. Retune this if you draw a frame with
# ornaments at a different height.
text_offset = 32

# White text over a dark gradient. Deliberately image-agnostic: the scrim
# guarantees contrast no matter what background gets dropped in, so swapping
# the picture never means retuning the colours.
position    = bottom
text_colour = 255,255,255
shadow      = true
scrim       = true

# --- content toggles -------------------------------------------------------
# With cover_background = true the artwork usually shows the title and author
# already, so show_title = false is worth trying — it leaves just the
# percentage, bar and counts, and avoids printing the title twice.
show_title          = true
show_progress_bar   = true
show_finished_count = true
show_library_count  = true

# Page numbers are NOT available. Kobo recalculates pagination from your font
# size and margins every time you open a book, so ___NumPages is -1 for every
# row in the database — "page 45 of 320" exists only while the book is open and
# is never written to disk. Reading time is recorded, and is the closest honest
# substitute. Both of these append to the "% read" line:
#
#   show_time_spent = true   ->  13% read  ·  3h 1m
#   show_time_left  = true   ->  13% read  ·  ~20h 16m left
#
# Time left is extrapolated from your pace so far, so it swings about early in
# a book and settles down later. It is suppressed below 3% read.
show_time_spent     = false
show_time_left      = false

# Go reference-time layout, NOT strftime. 02=day 01=month 2006=year 15:04=time
# Examples: "02 Jan 2006  15:04" · "Mon 2 Jan" · "2006-01-02 15:04"
date_format = 02 Jan 2006  15:04

# --- watch mode (seconds) --------------------------------------------------
# poll_interval is just a stat() of three files — effectively free, so it is
# short. min_regen is the floor between redraws.
#
# skip_unchanged is what makes a short interval affordable: a redraw costs about
# five seconds of CPU, so we only pay it when something on screen would actually
# differ. Turning your page but not moving the percentage costs nothing.
#
# Side effect: the clock on the sleep screen shows when your reading last
# CHANGED, not when the program last looked. A "stale" clock during a long
# session just means you haven't ticked over another percent yet.
poll_interval  = 15
min_regen      = 45
skip_unchanged = true

# --- colour panel ----------------------------------------------------------
# Kaleido mutes saturation heavily. Set true if a photo dithers badly.
grayscale = false
